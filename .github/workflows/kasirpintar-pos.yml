  build-macos-release:
    needs: [setup, test]
    if: needs.setup.outputs.platform == 'macos' && needs.setup.outputs.env == 'release'
    runs-on: macos-15
    environment: kasirpintar-pos
    steps:
      - name: Checkout from GitLab
        run: |
          git clone --depth 1 --branch ${{ needs.setup.outputs.tag }} \
            https://oauth2:${{ secrets.GITLAB_ACCESS_TOKEN }}@${{ secrets.GITLAB_BASE_URL }}/${{ secrets.GITLAB_ORG }}/kasirpintar_kasir.git .

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get --no-example

      - name: Restore App Store Connect API key
        run: |
          KEY_ID="${{ secrets.APPSTORE_API_KEY_ID }}"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          mkdir -p "$(dirname $KEY_PATH)"
          echo "${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}" | base64 -d > "$KEY_PATH"

      - name: Bump version in pubspec.yaml
        run: |
          sed -i '' "s/^version: .*/version: ${{ needs.setup.outputs.version_name }}+${{ needs.setup.outputs.version_code }}/" pubspec.yaml

      - name: Install CocoaPods dependencies
        run: cd macos && pod install --repo-update

      - name: Archive macOS (App Store Connect)
        run: |
          KEY_ID="${{ secrets.APPSTORE_API_KEY_ID }}"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          rm -rf build/macos/archive build/macos/export
          mkdir -p build/macos/export
          flutter build macos --config-only --release
          xcodebuild archive \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath build/macos/archive/KasirPintarPOS.xcarchive \
            ARCHS="$(uname -m)" \
            -quiet \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_API_ISSUER_ID }}"

      - name: Export macOS pkg
        run: |
          KEY_ID="${{ secrets.APPSTORE_API_KEY_ID }}"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          cat > /tmp/ExportOptions-macos-appstore.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>teamID</key>
            <string>JQBW9ZU72N</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/macos/archive/KasirPintarPOS.xcarchive \
            -exportPath build/macos/export \
            -exportOptionsPlist /tmp/ExportOptions-macos-appstore.plist \
            -quiet \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_API_ISSUER_ID }}"
          pkgutil --check-signature build/macos/export/*.pkg

      - name: Upload macOS pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-pkg
          path: build/macos/export/*.pkg
          retention-days: 7

      - name: Notify Slack — build-macos-release failed
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"<@U0CJ1CFSJ0Z> ❌ *KasirPintar POS* — Build macOS Release Failed\",
              \"attachments\": [{
                \"color\": \"danger\",
                \"fields\": [
                  {\"title\": \"Tag\", \"value\": \"${{ needs.setup.outputs.tag }}\", \"short\": true},
                  {\"title\": \"Job\", \"value\": \"build-macos-release\", \"short\": true},
                  {\"title\": \"Logs & Stacktrace\", \"value\": \"<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>\", \"short\": false}
                ]
              }]
            }"

