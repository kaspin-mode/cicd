# GitHub Actions workflow for kasirpintar-pos (Flutter).
# Triggered by GitLab CI via repository_dispatch (event_type: kasirpintar-pos).
#
# Environment: kasirpintar-pos
#   Environment Secrets (Settings → Environments → kasirpintar-pos → Environment secrets):
#     APPSTORE_API_KEY_ID        - App Store Connect API Key ID            (e.g. F9X6J9N6A7)
#     APPSTORE_API_ISSUER_ID     - App Store Connect Issuer ID             (e.g. 63db2cae-4ad9-...)
#     APPSTORE_API_KEY_P8_BASE64 - base64-encoded AuthKey_<ID>.p8 file    (`base64 -i AuthKey_xxx.p8 | pbcopy`)
#     WINDOWS_CERT_PFX_BASE64   - base64-encoded kaspin.pfx               (`base64 -i kaspin.pfx | pbcopy`)
#     WINDOWS_CERT_PASSWORD      - PFX certificate password
#     FIREBASE_IOS_APP_ID        - Firebase App ID for iOS                 (1:xxxx:ios:xxxx)
#     RELEASE_GITLAB_TOKEN       - GitLab PAT with api scope (for GitLab Release uploads)
#     GITLAB_BASE_URL            - e.g. gitlab.com
#     IOS_DIST_CERT_P12_BASE64   - base64-encoded iOS Distribution cert .p12
#     IOS_DIST_CERT_P12_PASSWORD - Password for iOS .p12
#     IOS_ADHOC_PROFILE_BASE64   - base64-encoded AdHoc provisioning profile
#     IOS_ADHOC_PROFILE_NAME     - AdHoc profile name string (must match Xcode)
#     IOS_APPSTORE_PROFILE_BASE64 - base64-encoded App Store provisioning profile
#     IOS_APPSTORE_PROFILE_NAME  - App Store profile name string
#     MACOS_DEV_CERT_P12_BASE64  - base64-encoded Mac Distribution cert .p12
#     MACOS_DEV_CERT_P12_PASSWORD - Password for macOS .p12
#     MACOS_DEV_PROFILE_BASE64   - base64-encoded macOS provisioning profile
#     MACOS_DEV_PROFILE_NAME     - macOS profile name string
#
#   Repository Secrets (Settings → Secrets and variables → Actions → Repository secrets):
#     GITLAB_ACCESS_TOKEN  - GitLab deploy token to clone kasirpintar_kasir (read_repository scope)
#     FIREBASE_TOKEN       - Firebase CLI token (`firebase login:ci`)
#     SLACK_WEBHOOK_URL    - Slack Incoming Webhook URL for CI/CD notifications

name: KasirPintar POS CI/CD

on:
  repository_dispatch:
    types: [kasirpintar-pos]
  workflow_dispatch:
    inputs:
      tag:
        description: >
          GitLab tag — e.g.
          debug-macos-20261116.1300 | debug-ios-20261116.1300 | debug-windows-20261116.1300 |
          macos-1.2.3+45 | ios-1.2.3+45 | windows-1.2.3+45
        required: true

jobs:

  # ── Detect platform, env, and version from tag ───────────────────────────────

  setup:
    runs-on: ubuntu-latest
    outputs:
      tag:          ${{ steps.detect.outputs.tag }}
      platform:     ${{ steps.detect.outputs.platform }}
      env:          ${{ steps.detect.outputs.env }}
      version_name: ${{ steps.detect.outputs.version_name }}
      version_code: ${{ steps.detect.outputs.version_code }}
    steps:
      - id: detect
        run: |
          TAG="${{ github.event.client_payload.tag || inputs.tag }}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

          if   [[ "$TAG" =~ ^debug-macos- ]];   then PLATFORM=macos;   ENV=debug
          elif [[ "$TAG" =~ ^debug-ios- ]];     then PLATFORM=ios;     ENV=debug
          elif [[ "$TAG" =~ ^debug-windows- ]]; then PLATFORM=windows; ENV=debug
          elif [[ "$TAG" =~ ^macos-([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
            PLATFORM=macos; ENV=release
            echo "version_name=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "version_code=${BASH_REMATCH[2]}" >> $GITHUB_OUTPUT
          elif [[ "$TAG" =~ ^ios-([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
            PLATFORM=ios; ENV=release
            echo "version_name=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "version_code=${BASH_REMATCH[2]}" >> $GITHUB_OUTPUT
          elif [[ "$TAG" =~ ^windows-([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
            PLATFORM=windows; ENV=release
            echo "version_name=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "version_code=${BASH_REMATCH[2]}" >> $GITHUB_OUTPUT
          else
            PLATFORM=unknown; ENV=unknown
          fi

          echo "platform=${PLATFORM}" >> $GITHUB_OUTPUT
          echo "env=${ENV}"           >> $GITHUB_OUTPUT

  # ── Test (flutter test) — runs for all valid tags ────────────────────────────

  test:
    needs: setup
    if: needs.setup.outputs.env != 'unknown'
    runs-on: macos-15
    environment: kasirpintar-pos
    outputs:
      test_count: ${{ steps.stats.outputs.test_count }}
      coverage:   ${{ steps.stats.outputs.coverage }}
    steps:
      - name: Checkout from GitLab
        run: |
          git clone --depth 1 --branch ${{ needs.setup.outputs.tag }} \
            https://oauth2:${{ secrets.GITLAB_ACCESS_TOKEN }}@${{ secrets.GITLAB_BASE_URL }}/${{ secrets.GITLAB_ORG }}/kasirpintar_kasir.git .

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get --no-example

      - name: Run unit & widget tests with coverage
        run: |
          flutter test \
            test/unit/ \
            test/widget/ \
            test/widget_test.dart \
            --coverage \
            --reporter expanded \
            --no-pub

      - name: Extract test stats
        id: stats
        if: always()
        run: |
          # Parse test count from flutter test output
          TESTS=$(grep -oE '[0-9]+ tests? passed' coverage/lcov.info 2>/dev/null | grep -oE '[0-9]+' | head -1 || echo "0")
          # shortcut: test count parsed from lcov is 0 if not embedded; real count needs --reporter json, upgrade when needed
          echo "test_count=${TESTS:-0}" >> $GITHUB_OUTPUT
          # Parse coverage % from lcov.info
          if [ -f coverage/lcov.info ]; then
            COV=$(awk '/^LH:/{h+=$2} /^LF:/{f+=$2} END{if(f>0) printf "%.1f", h*100/f; else print "0"}' coverage/lcov.info)
            echo "coverage=${COV}" >> $GITHUB_OUTPUT
          else
            echo "coverage=0" >> $GITHUB_OUTPUT
          fi

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 30

      - name: Upload coverage to GitLab Generic Packages
        if: always()
        run: |
          TAG="${{ needs.setup.outputs.tag }}"
          curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "PRIVATE-TOKEN: ${{ secrets.RELEASE_GITLAB_TOKEN }}" \
            --upload-file coverage/lcov.info \
            "https://${{ secrets.GITLAB_BASE_URL }}/api/v4/projects/${{ secrets.GITLAB_ORG }}%2Fkasirpintar_kasir/packages/generic/coverage/${TAG}/lcov.info"

      - name: Notify Slack — test failed
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"<@U0CJ1CFSJ0Z> ❌ *KasirPintar POS* — Test Failed\",
              \"attachments\": [{
                \"color\": \"danger\",
                \"fields\": [
                  {\"title\": \"Tag\", \"value\": \"${{ needs.setup.outputs.tag }}\", \"short\": true},
                  {\"title\": \"Job\", \"value\": \"test\", \"short\": true},
                  {\"title\": \"Logs & Stacktrace\", \"value\": \"<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>\", \"short\": false}
                ]
              }]
            }"

  # ── Build: macOS debug artifact ───────────────────────────────────────────────

  build-macos-debug:
    needs: [setup, test]
    if: needs.setup.outputs.platform == 'macos' && needs.setup.outputs.env == 'debug'
    runs-on: macos-15
    environment: kasirpintar-pos
    steps:
      - name: Checkout from GitLab
        run: |
          git clone --depth 1 --branch ${{ needs.setup.outputs.tag }} \
            https://oauth2:${{ secrets.GITLAB_ACCESS_TOKEN }}@${{ secrets.GITLAB_BASE_URL }}/${{ secrets.GITLAB_ORG }}/kasirpintar_kasir.git .

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get --no-example

      - name: Restore App Store Connect API key
        run: |
          KEY_ID="${{ secrets.APPSTORE_API_KEY_ID }}"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          mkdir -p "$(dirname $KEY_PATH)"
          echo "${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}" | base64 -d > "$KEY_PATH"

      - name: Install macOS provisioning profile
        run: |
          echo "${{ secrets.MACOS_DEV_PROFILE_BASE64 }}" | base64 -d > /tmp/profile.provisionprofile
          PP_UUID=$(security cms -D -i /tmp/profile.provisionprofile | \
            plutil -extract UUID xml1 -o - - | \
            sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp /tmp/profile.provisionprofile \
            "$HOME/Library/MobileDevice/Provisioning Profiles/${PP_UUID}.provisionprofile"
          echo "PP_UUID=${PP_UUID}" >> $GITHUB_ENV

      # Cache HANYA macos/Pods — JANGAN cache ~/.cocoapods
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: macos/Pods
          key: pods-macos-v2-${{ hashFiles('macos/Podfile.lock') }}
          restore-keys: pods-macos-v2-

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: build/macos/DerivedData
          key: derived-data-macos-${{ hashFiles('macos/Podfile.lock') }}-${{ hashFiles('**/*.dart') }}
          restore-keys: derived-data-macos-${{ hashFiles('macos/Podfile.lock') }}-

      - name: Install CocoaPods dependencies
        run: cd macos && pod install

      - name: Build macOS debug artifact
        run: |
          KEY_ID="${{ secrets.APPSTORE_API_KEY_ID }}"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          flutter build macos --config-only --debug
          # -destination generic/platform=macOS agar tidak gagal validasi device UDID runner
          xcodebuild archive \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "generic/platform=macOS" \
            -archivePath build/macos/archive/Runner.xcarchive \
            -jobs $(sysctl -n hw.ncpu) \
            -showBuildTimingSummary \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_API_ISSUER_ID }}" \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym \
            ENABLE_BITCODE=NO

          mkdir -p build/macos/Build/Products/Debug
          APP_PATH=$(find build/macos/archive/Runner.xcarchive -name "*.app" | head -1)
          cp -R "$APP_PATH" build/macos/Build/Products/Debug/

      - name: Upload macOS debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-debug
          path: build/macos/Build/Products/Debug/
          retention-days: 7

      - name: Notify Slack — build-macos-debug failed
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"<@U0CJ1CFSJ0Z> ❌ *KasirPintar POS* — Build macOS Debug Failed\",
              \"attachments\": [{
                \"color\": \"danger\",
                \"fields\": [
                  {\"title\": \"Tag\", \"value\": \"${{ needs.setup.outputs.tag }}\", \"short\": true},
                  {\"title\": \"Job\", \"value\": \"build-macos-debug\", \"short\": true},
                  {\"title\": \"Logs & Stacktrace\", \"value\": \"<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>\", \"short\": false}
                ]
              }]
            }"

  # ── Deploy: macOS debug → GitLab Release ─────────────────────────────────────
  # NOTE: Firebase App Distribution TIDAK mendukung macOS.

  deploy-macos-debug-gitlab:
    needs: [setup, test, build-macos-debug]
    if: needs.setup.outputs.platform == 'macos' && needs.setup.outputs.env == 'debug'
    runs-on: ubuntu-latest
    environment: kasirpintar-pos
    env:
      TAG:         ${{ needs.setup.outputs.tag }}
      RELEASE_TAG: pos-${{ needs.setup.outputs.tag }}
      PROJECT_ID:  "157"
      BASE_URL:    https://${{ secrets.GITLAB_BASE_URL }}/api/v4/projects/157
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-debug
          path: macos-debug/

      - name: Create GitLab tag + Release and upload macOS debug zip
        run: |
          FILE_NAME="kasir-pintar-pos-${TAG}-macos.zip"
          cd macos-debug
          zip -r "../$FILE_NAME" .
          cd ..

          HEADERS=(-H "PRIVATE-TOKEN: ${{ secrets.RELEASE_GITLAB_TOKEN }}" -H "Content-Type: application/json")

          # 1. Create tag (ignore error if already exists)
          curl --silent "$BASE_URL/repository/tags" \
            -X POST "${HEADERS[@]}" \
            -d "{\"tag_name\":\"${RELEASE_TAG}\",\"ref\":\"main\"}" || true

          # 2. Create Release (ignore error if already exists)
          curl --silent \
            "$BASE_URL/releases" \
            -X POST "${HEADERS[@]}" \
            -d "{\"name\":\"${RELEASE_TAG}\",\"tag_name\":\"${RELEASE_TAG}\",\"description\":\"Tag: ${TAG}\"}" || true

          # 3. Upload zip via Generic Packages API
          curl --fail-with-body --silent --show-error \
            --request PUT \
            -H "PRIVATE-TOKEN: ${{ secrets.RELEASE_GITLAB_TOKEN }}" \
            --upload-file "$FILE_NAME" \
            "$BASE_URL/packages/generic/macos-debug/${RELEASE_TAG}/${FILE_NAME}"

          # 4. Link package to Release
          DIRECT_URL="https://${{ secrets.GITLAB_BASE_URL }}/api/v4/projects/${PROJECT_ID}/packages/generic/macos-debug/${RELEASE_TAG}/${FILE_NAME}"
          curl --fail-with-body --silent --show-error \
            "$BASE_URL/releases/${RELEASE_TAG}/assets/links" \
            -X POST "${HEADERS[@]}" \
            -d "{\"name\":\"${FILE_NAME}\",\"url\":\"${DIRECT_URL}\",\"link_type\":\"package\"}"

          echo "✅ https://${{ secrets.GITLAB_BASE_URL }}/alan/desktop-release/-/releases/${RELEASE_TAG}"

      - name: Notify Slack — deploy-macos-debug-gitlab failed
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"<@U0CJ1CFSJ0Z> ❌ *KasirPintar POS* — Deploy macOS Debug (GitLab) Failed\",
              \"attachments\": [{
                \"color\": \"danger\",
                \"fields\": [
                  {\"title\": \"Tag\", \"value\": \"${{ needs.setup.outputs.tag }}\", \"short\": true},
                  {\"title\": \"Job\", \"value\": \"deploy-macos-debug-gitlab\", \"short\": true},
                  {\"title\": \"Logs & Stacktrace\", \"value\": \"<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>\", \"short\": false}
                ]
              }]
            }"

      - name: Notify Slack — deploy succeeded
        if: success()
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"<@U0CJ1CFSJ0Z> ✅ *KasirPintar POS* — Deploy macOS Debug (GitLab) Succeeded\",
              \"attachments\": [{
                \"color\": \"good\",
                \"fields\": [
                  {\"title\": \"Tag\", \"value\": \"${{ needs.setup.outputs.tag }}\", \"short\": true},
                  {\"title\": \"Tests Passed\", \"value\": \"${{ needs.test.outputs.test_count }}\", \"short\": true},
                  {\"title\": \"Code Coverage\", \"value\": \"${{ needs.test.outputs.coverage }}%\", \"short\": true},
                  {\"title\": \"Deployment\", \"value\": \"<https://${{ secrets.GITLAB_BASE_URL }}/alan/desktop-release/-/releases/${{ env.RELEASE_TAG }}|View Release>\", \"short\": false},
                  {\"title\": \"Run\", \"value\": \"<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>\", \"short\": false}
                ]
              }]
            }"

  # ── Build: iOS debug IPA (ad-hoc) ────────────────────────────────────────────

  build-ios-debug:
    needs: [setup, test]
    if: needs.setup.outputs.platform == 'ios' && needs.setup.outputs.env == 'debug'
    runs-on: macos-15
    environment: kasirpintar-pos
    steps:
      - name: Checkout from GitLab
        run: |
          git clone --depth 1 --branch ${{ needs.setup.outputs.tag }} \
            https://oauth2:${{ secrets.GITLAB_ACCESS_TOKEN }}@${{ secrets.GITLAB_BASE_URL }}/${{ secrets.GITLAB_ORG }}/kasirpintar_kasir.git .

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get --no-example

      - name: Restore App Store Connect API key
        run: |
          KEY_ID="${{ secrets.APPSTORE_API_KEY_ID }}"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          mkdir -p "$(dirname $KEY_PATH)"
          echo "${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}" | base64 -d > "$KEY_PATH"

      - name: Import iOS distribution certificate into Keychain
        run: |
          echo "${{ secrets.IOS_DIST_CERT_P12_BASE64 }}" | base64 -d > /tmp/dist.p12
          echo "${{ secrets.IOS_ADHOC_PROFILE_BASE64 }}" | base64 -d > /tmp/adhoc.mobileprovision

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import /tmp/dist.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "${{ secrets.IOS_DIST_CERT_P12_PASSWORD }}" \
            -A -t cert -f pkcs12
          # WAJIB: mencegah codesign hang saat meminta dialog password GUI
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          PP_UUID=$(security cms -D -i /tmp/adhoc.mobileprovision | \
            plutil -extract UUID xml1 -o - - | \
            sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp /tmp/adhoc.mobileprovision \
            "$HOME/Library/MobileDevice/Provisioning Profiles/${PP_UUID}.mobileprovision"
          echo "PP_UUID=${PP_UUID}" >> $GITHUB_ENV

      # Cache HANYA ios/Pods — JANGAN cache ~/.cocoapods
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-ios-v2-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-ios-v2-

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: build/ios/DerivedData
          key: derived-data-ios-${{ hashFiles('ios/Podfile.lock') }}-${{ hashFiles('**/*.dart') }}
          restore-keys: derived-data-ios-${{ hashFiles('ios/Podfile.lock') }}-

      - name: Install CocoaPods dependencies
        run: cd ios && pod install

      - name: Archive iOS (debug / ad-hoc)
        run: |
          KEY_ID="${{ secrets.APPSTORE_API_KEY_ID }}"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          flutter build ios --config-only --release
          # -destination generic/platform=iOS agar tidak gagal validasi UDID runner
          # Tanpa CODE_SIGN_STYLE=Manual: biarkan -allowProvisioningUpdates + ASC key
          # resolve profile untuk semua target (Runner + ImageNotification extension)
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/ios/archive/Runner.xcarchive \
            -derivedDataPath build/ios/DerivedData \
            -jobs $(sysctl -n hw.ncpu) \
            -quiet \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_API_ISSUER_ID }}"

      - name: Export iOS IPA (ad-hoc)
        run: |
          KEY_ID="${{ secrets.APPSTORE_API_KEY_ID }}"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          cat > /tmp/ExportOptions-ios-adhoc.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>release-testing</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>JQBW9ZU72N</string>
            <key>uploadSymbols</key>
            <true/>
            <key>thinning</key>
            <string>&lt;none&gt;</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist /tmp/ExportOptions-ios-adhoc.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_API_ISSUER_ID }}"

      - name: Upload iOS debug IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 7

      - name: Notify Slack — build-ios-debug failed
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"<@U0CJ1CFSJ0Z> ❌ *KasirPintar POS* — Build iOS Debug Failed\",
              \"attachments\": [{
                \"color\": \"danger\",
                \"fields\": [
                  {\"title\": \"Tag\", \"value\": \"${{ needs.setup.outputs.tag }}\", \"short\": true},
                  {\"title\": \"Job\", \"value\": \"build-ios-debug\", \"short\": true},
                  {\"title\": \"Logs & Stacktrace\", \"value\": \"<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>\", \"short\": false}
                ]
              }]
            }"

  # ── Deploy: iOS debug IPA → Firebase App Distribution ────────────────────────

  deploy-ios-debug-firebase:
    needs: [setup, test, build-ios-debug]
    if: needs.setup.outputs.platform == 'ios' && needs.setup.outputs.env == 'debug'
    runs-on: ubuntu-latest
    environment: kasirpintar-pos
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ios-debug-ipa
          path: ipa-out/

      - name: Find IPA file
        id: ipa
        run: echo "path=$(find ipa-out -name '*.ipa' | head -1)" >> $GITHUB_OUTPUT

      - uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_IOS_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: Tech
          file: ${{ steps.ipa.outputs.path }}
          releaseNotes: "Build from tag ${{ needs.setup.outputs.tag }}"

      - name: Notify Slack — deploy-ios-debug-firebase failed
        if: failure()
        run: |
