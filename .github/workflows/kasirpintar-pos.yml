  # ── Build: Windows debug MSIX ─────────────────────────────────────────────────

  build-windows-debug:
    needs: [setup, test]
    if: needs.setup.outputs.platform == 'windows' && needs.setup.outputs.env == 'debug'
    runs-on: windows-2022
    environment: kasirpintar-pos
    steps:
      - name: Checkout from GitLab
        shell: bash
        run: |
          git clone --depth 1 --branch ${{ needs.setup.outputs.tag }} \
            https://oauth2:${{ secrets.GITLAB_ACCESS_TOKEN }}@${{ secrets.GITLAB_BASE_URL }}/${{ secrets.GITLAB_ORG }}/kasirpintar_kasir.git .

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Configure Git auth and dependency overrides for Windows
        shell: pwsh
        run: |
          git config --global url."https://oauth2:${{ secrets.GITLAB_ACCESS_TOKEN }}@${{ secrets.GITLAB_BASE_URL }}/".insteadOf "https://${{ secrets.GITLAB_BASE_URL }}/"

          $lines = @(
            'dependency_overrides:'
            '  cloud_firestore:'
            '    git:'
            '      url: https://${{ secrets.GITLAB_BASE_URL }}/alan/dashboard'
            '      ref: main'
            '      path: plugins/cloud_firestore'
            '  firebase_auth:'
            '    git:'
            '      url: https://${{ secrets.GITLAB_BASE_URL }}/alan/dashboard'
            '      ref: main'
            '      path: plugins/firebase_auth'
            '  firebase_core:'
            '    git:'
            '      url: https://${{ secrets.GITLAB_BASE_URL }}/alan/dashboard'
            '      ref: main'
            '      path: plugins/firebase_core'
          ) -join [Environment]::NewLine
          $content = Get-Content pubspec.yaml -Raw
          $content = $content -replace '(?m)^dependency_overrides:', $lines
          Set-Content -Path pubspec.yaml -Value $content -NoNewline
          git diff pubspec.yaml

      - name: Flutter pub get
        run: flutter pub get --no-example

      - name: Restore PFX certificate
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.WINDOWS_CERT_PFX_BASE64 }}")
          [IO.File]::WriteAllBytes("$env:USERPROFILE\kaspin.pfx", $bytes)

      - name: Build Windows debug MSIX
        shell: pwsh
        run: |
          flutter build windows --debug
          flutter pub run msix:create `
            --store `
            --certificate-path "$env:USERPROFILE\kaspin.pfx" `
            --certificate-password "${{ secrets.WINDOWS_CERT_PASSWORD }}" `
            --logo-path "assets/images/kasir_pintar.png" `
            --publisher-display-name "PT KASIR PINTAR INTERNASIONAL" `
            --publisher "CN=CB035A2C-7F6B-46A1-8042-42B86FFE7F03"

      - name: Upload Windows debug MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-debug-msix
          path: build/**/*.msix
          retention-days: 7

      - name: Notify Slack — build-windows-debug failed
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"<@U0CJ1CFSJ0Z> ❌ *KasirPintar POS* — Build Windows Debug Failed\",
              \"attachments\": [{
                \"color\": \"danger\",
                \"fields\": [
                  {\"title\": \"Tag\", \"value\": \"${{ needs.setup.outputs.tag }}\", \"short\": true},
                  {\"title\": \"Job\", \"value\": \"build-windows-debug\", \"short\": true},
                  {\"title\": \"Logs & Stacktrace\", \"value\": \"<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>\", \"short\": false}
                ]
              }]
            }"

  # ── Deploy: Windows debug MSIX → GitLab Release ───────────────────────────────

  deploy-windows-debug-gitlab:
    needs: [setup, test, build-windows-debug]
    if: needs.setup.outputs.platform == 'windows' && needs.setup.outputs.env == 'debug'
    runs-on: ubuntu-latest
    environment: kasirpintar-pos
    env:
      TAG:         ${{ needs.setup.outputs.tag }}
      RELEASE_TAG: pos-${{ needs.setup.outputs.tag }}
      PROJECT_ID:  "157"
      BASE_URL:    https://${{ secrets.GITLAB_BASE_URL }}/api/v4/projects/157
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-debug-msix
          path: msix-out/

      - name: Create GitLab tag + Release and upload MSIX
        run: |
          HEADERS=(-H "PRIVATE-TOKEN: ${{ secrets.RELEASE_GITLAB_TOKEN }}" -H "Content-Type: application/json")

          # 1. Create tag (ignore error if already exists)
          curl --silent "$BASE_URL/repository/tags" \
            -X POST "${HEADERS[@]}" \
            -d "{\"tag_name\":\"${RELEASE_TAG}\",\"ref\":\"main\"}" || true

          # 2. Create Release
          curl --fail-with-body --silent --show-error \
            "$BASE_URL/releases" \
            -X POST "${HEADERS[@]}" \
            -d "{\"name\":\"${RELEASE_TAG}\",\"tag_name\":\"${RELEASE_TAG}\",\"description\":\"Tag: ${TAG}\"}"

          # 3. Upload MSIX
          MSIX_FILE=$(find msix-out -name "*.msix" | head -1)
          FILE_NAME="kasir-pintar-pos-${TAG}.msix"
          curl --fail-with-body --silent --show-error \
            --request PUT \
            -H "PRIVATE-TOKEN: ${{ secrets.RELEASE_GITLAB_TOKEN }}" \
            --upload-file "$MSIX_FILE" \
            "$BASE_URL/packages/generic/windows-msix/${RELEASE_TAG}/${FILE_NAME}"

          # 4. Link package to Release
          DIRECT_URL="https://${{ secrets.GITLAB_BASE_URL }}/api/v4/projects/${PROJECT_ID}/packages/generic/windows-msix/${RELEASE_TAG}/${FILE_NAME}"
          curl --fail-with-body --silent --show-error \
            "$BASE_URL/releases/${RELEASE_TAG}/assets/links" \
            -X POST "${HEADERS[@]}" \
            -d "{\"name\":\"${FILE_NAME}\",\"url\":\"${DIRECT_URL}\",\"link_type\":\"package\"}"

          echo "✅ https://${{ secrets.GITLAB_BASE_URL }}/alan/desktop-release/-/releases/${RELEASE_TAG}"

      - name: Notify Slack — deploy-windows-debug-gitlab failed
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"<@U0CJ1CFSJ0Z> ❌ *KasirPintar POS* — Deploy Windows Debug (GitLab) Failed\",
              \"attachments\": [{
                \"color\": \"danger\",
                \"fields\": [
                  {\"title\": \"Tag\", \"value\": \"${{ needs.setup.outputs.tag }}\", \"short\": true},
                  {\"title\": \"Job\", \"value\": \"deploy-windows-debug-gitlab\", \"short\": true},
                  {\"title\": \"Logs & Stacktrace\", \"value\": \"<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>\", \"short\": false}
                ]
              }]
            }"

      - name: Notify Slack — deploy succeeded
        if: success()
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"<@U0CJ1CFSJ0Z> ✅ *KasirPintar POS* — Deploy Windows Debug (GitLab) Succeeded\",
              \"attachments\": [{
                \"color\": \"good\",
                \"fields\": [
                  {\"title\": \"Tag\", \"value\": \"${{ needs.setup.outputs.tag }}\", \"short\": true},
                  {\"title\": \"Tests Passed\", \"value\": \"${{ needs.test.outputs.test_count }}\", \"short\": true},
                  {\"title\": \"Code Coverage\", \"value\": \"${{ needs.test.outputs.coverage }}%\", \"short\": true},
                  {\"title\": \"Deployment\", \"value\": \"<https://${{ secrets.GITLAB_BASE_URL }}/alan/desktop-release/-/releases/${{ env.RELEASE_TAG }}|View Release>\", \"short\": false},
                  {\"title\": \"Run\", \"value\": \"<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>\", \"short\": false}
                ]
              }]
            }"

