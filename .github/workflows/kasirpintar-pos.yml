  # ── Build: iOS release IPA (App Store) ───────────────────────────────────────

  build-ios-release:
    needs: [setup, test]
    if: needs.setup.outputs.platform == 'ios' && needs.setup.outputs.env == 'release'
    runs-on: macos-15
    environment: kasirpintar-pos
    steps:
      - name: Checkout from GitLab
        run: |
          git clone --depth 1 --branch ${{ needs.setup.outputs.tag }} \
            https://oauth2:${{ secrets.GITLAB_ACCESS_TOKEN }}@${{ secrets.GITLAB_BASE_URL }}/${{ secrets.GITLAB_ORG }}/kasirpintar_kasir.git .

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get --no-example

      - name: Restore App Store Connect API key
        run: |
          KEY_ID="${{ secrets.APPSTORE_API_KEY_ID }}"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          mkdir -p "$(dirname $KEY_PATH)"
          echo "${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}" | base64 -d > "$KEY_PATH"

      - name: Import iOS distribution certificate into Keychain
        run: |
          echo "${{ secrets.IOS_DIST_CERT_P12_BASE64 }}" | base64 -d > /tmp/dist.p12
          echo "${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}" | base64 -d > /tmp/appstore.mobileprovision

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import /tmp/dist.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "${{ secrets.IOS_DIST_CERT_P12_PASSWORD }}" \
            -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          PP_UUID=$(security cms -D -i /tmp/appstore.mobileprovision | \
            plutil -extract UUID xml1 -o - - | \
            sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp /tmp/appstore.mobileprovision \
            "$HOME/Library/MobileDevice/Provisioning Profiles/${PP_UUID}.mobileprovision"
          echo "PP_UUID=${PP_UUID}" >> $GITHUB_ENV

      - name: Bump version in pubspec.yaml
        run: |
          sed -i '' "s/^version: .*/version: ${{ needs.setup.outputs.version_name }}+${{ needs.setup.outputs.version_code }}/" pubspec.yaml

      # Cache HANYA ios/Pods — JANGAN cache ~/.cocoapods
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-ios-v2-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-ios-v2-

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: build/ios/DerivedData
          key: derived-data-ios-${{ hashFiles('ios/Podfile.lock') }}-${{ hashFiles('**/*.dart') }}
          restore-keys: derived-data-ios-${{ hashFiles('ios/Podfile.lock') }}-

      - name: Install CocoaPods dependencies
        run: cd ios && pod install

      - name: Archive iOS (release / App Store Connect)
        run: |
          KEY_ID="${{ secrets.APPSTORE_API_KEY_ID }}"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          flutter build ios --config-only --release
          # Tanpa CODE_SIGN_STYLE=Manual: biarkan -allowProvisioningUpdates + ASC key
          # resolve profile untuk semua target (Runner + ImageNotification extension)
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/ios/archive/Runner.xcarchive \
            -derivedDataPath build/ios/DerivedData \
            -jobs $(sysctl -n hw.ncpu) \
            -quiet \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_API_ISSUER_ID }}"

      - name: Export iOS IPA (App Store Connect)
        run: |
          KEY_ID="${{ secrets.APPSTORE_API_KEY_ID }}"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          cat > /tmp/ExportOptions-ios-appstore.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>JQBW9ZU72N</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist /tmp/ExportOptions-ios-appstore.plist \
            -quiet \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_API_ISSUER_ID }}"

      - name: Upload iOS release IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 7

      - name: Notify Slack — build-ios-release failed
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"<@U0CJ1CFSJ0Z> ❌ *KasirPintar POS* — Build iOS Release Failed\",
              \"attachments\": [{
                \"color\": \"danger\",
                \"fields\": [
                  {\"title\": \"Tag\", \"value\": \"${{ needs.setup.outputs.tag }}\", \"short\": true},
                  {\"title\": \"Job\", \"value\": \"build-ios-release\", \"short\": true},
                  {\"title\": \"Logs & Stacktrace\", \"value\": \"<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>\", \"short\": false}
                ]
              }]
            }"

  # ── Deploy: iOS release IPA → TestFlight ─────────────────────────────────────

  deploy-ios-release-appstore:
    needs: [setup, test, build-ios-release]
    if: needs.setup.outputs.platform == 'ios' && needs.setup.outputs.env == 'release'
    runs-on: macos-15
    environment: kasirpintar-pos
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ios-release-ipa
          path: ipa-out/

      - name: Restore App Store Connect API key
        run: |
          KEY_ID="${{ secrets.APPSTORE_API_KEY_ID }}"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          mkdir -p "$(dirname $KEY_PATH)"
          echo "${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}" | base64 -d > "$KEY_PATH"

      - name: Upload to TestFlight via altool
        run: |
          IPA=$(find ipa-out -name "*.ipa" | head -1)
          xcrun altool --upload-app \
            --type ios \
            -f "$IPA" \
            --apiKey  "${{ secrets.APPSTORE_API_KEY_ID }}" \
            --apiIssuer "${{ secrets.APPSTORE_API_ISSUER_ID }}"

      - name: Notify Slack — deploy-ios-release-appstore failed
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"<@U0CJ1CFSJ0Z> ❌ *KasirPintar POS* — Deploy iOS Release (App Store) Failed\",
              \"attachments\": [{
                \"color\": \"danger\",
                \"fields\": [
                  {\"title\": \"Tag\", \"value\": \"${{ needs.setup.outputs.tag }}\", \"short\": true},
                  {\"title\": \"Job\", \"value\": \"deploy-ios-release-appstore\", \"short\": true},
                  {\"title\": \"Logs & Stacktrace\", \"value\": \"<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>\", \"short\": false}
                ]
              }]
            }"

      - name: Notify Slack — deploy succeeded
        if: success()
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"<@U0CJ1CFSJ0Z> ✅ *KasirPintar POS* — Deploy iOS Release (App Store) Succeeded\",
              \"attachments\": [{
                \"color\": \"good\",
                \"fields\": [
                  {\"title\": \"Tag\", \"value\": \"${{ needs.setup.outputs.tag }}\", \"short\": true},
                  {\"title\": \"Tests Passed\", \"value\": \"${{ needs.test.outputs.test_count }}\", \"short\": true},
                  {\"title\": \"Code Coverage\", \"value\": \"${{ needs.test.outputs.coverage }}%\", \"short\": true},
                  {\"title\": \"Deployment\", \"value\": \"<https://appstoreconnect.apple.com|View Release>\", \"short\": false},
                  {\"title\": \"Run\", \"value\": \"<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>\", \"short\": false}
                ]
              }]
            }"

  # ── Build: Windows release MSIX ──────────────────────────────────────────────

  build-windows-release:
    needs: [setup, test]
    if: needs.setup.outputs.platform == 'windows' && needs.setup.outputs.env == 'release'
    runs-on: windows-2022
    environment: kasirpintar-pos
    steps:
      - name: Checkout from GitLab
        shell: bash
        run: |
          git clone --depth 1 --branch ${{ needs.setup.outputs.tag }} \
            https://oauth2:${{ secrets.GITLAB_ACCESS_TOKEN }}@${{ secrets.GITLAB_BASE_URL }}/${{ secrets.GITLAB_ORG }}/kasirpintar_kasir.git .

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Configure Git auth and dependency overrides for Windows
        shell: pwsh
        run: |
          git config --global url."https://oauth2:${{ secrets.GITLAB_ACCESS_TOKEN }}@${{ secrets.GITLAB_BASE_URL }}/".insteadOf "https://${{ secrets.GITLAB_BASE_URL }}/"

          $lines = @(
            'dependency_overrides:'
            '  cloud_firestore:'
            '    git:'
            '      url: https://${{ secrets.GITLAB_BASE_URL }}/alan/dashboard'
            '      ref: main'
            '      path: plugins/cloud_firestore'
            '  firebase_auth:'
            '    git:'
            '      url: https://${{ secrets.GITLAB_BASE_URL }}/alan/dashboard'
            '      ref: main'
            '      path: plugins/firebase_auth'
            '  firebase_core:'
            '    git:'
            '      url: https://${{ secrets.GITLAB_BASE_URL }}/alan/dashboard'
            '      ref: main'
            '      path: plugins/firebase_core'
          ) -join [Environment]::NewLine
          $content = Get-Content pubspec.yaml -Raw
          $content = $content -replace '(?m)^dependency_overrides:', $lines
          Set-Content -Path pubspec.yaml -Value $content -NoNewline
          git diff pubspec.yaml

      - name: Flutter pub get
        run: flutter pub get --no-example

      - name: Restore PFX certificate
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.WINDOWS_CERT_PFX_BASE64 }}")
          [IO.File]::WriteAllBytes("$env:USERPROFILE\kaspin.pfx", $bytes)

      - name: Bump version in pubspec.yaml
        shell: bash
        run: |
          sed -i "s/^version: .*/version: ${{ needs.setup.outputs.version_name }}+${{ needs.setup.outputs.version_code }}/" pubspec.yaml

      - name: Build Windows release MSIX
        shell: pwsh
        run: |
          flutter build windows --release
          flutter pub run msix:create `
            --store `
            --certificate-path "$env:USERPROFILE\kaspin.pfx" `
            --certificate-password "${{ secrets.WINDOWS_CERT_PASSWORD }}" `
            --logo-path "assets/images/kasir_pintar.png" `
            --publisher-display-name "PT KASIR PINTAR INTERNASIONAL" `
            --publisher "CN=CB035A2C-7F6B-46A1-8042-42B86FFE7F03"

      - name: Upload Windows release MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-msix
          path: build/**/*.msix
          retention-days: 30

      - name: Notify Slack — build-windows-release failed
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"<@U0CJ1CFSJ0Z> ❌ *KasirPintar POS* — Build Windows Release Failed\",
              \"attachments\": [{
                \"color\": \"danger\",
                \"fields\": [
                  {\"title\": \"Tag\", \"value\": \"${{ needs.setup.outputs.tag }}\", \"short\": true},
                  {\"title\": \"Job\", \"value\": \"build-windows-release\", \"short\": true},
                  {\"title\": \"Logs & Stacktrace\", \"value\": \"<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>\", \"short\": false}
                ]
              }]
            }"

  # ── Deploy: Windows release MSIX → GitLab Release ────────────────────────────

  deploy-windows-release-gitlab:
    needs: [setup, test, build-windows-release]
    if: needs.setup.outputs.platform == 'windows' && needs.setup.outputs.env == 'release'
    runs-on: ubuntu-latest
    environment: kasirpintar-pos
    env:
      TAG:          ${{ needs.setup.outputs.tag }}
      RELEASE_TAG:  pos-${{ needs.setup.outputs.tag }}
      PROJECT_ID:   "157"
      BASE_URL:     https://${{ secrets.GITLAB_BASE_URL }}/api/v4/projects/157
      VERSION_NAME: ${{ needs.setup.outputs.version_name }}
      VERSION_CODE: ${{ needs.setup.outputs.version_code }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release-msix
          path: msix-out/

      - name: Create GitLab tag + Release and upload MSIX
        run: |
          HEADERS=(-H "PRIVATE-TOKEN: ${{ secrets.RELEASE_GITLAB_TOKEN }}" -H "Content-Type: application/json")

          # 1. Create tag (ignore error if already exists)
          curl --silent "$BASE_URL/repository/tags" \
            -X POST "${HEADERS[@]}" \
            -d "{\"tag_name\":\"${RELEASE_TAG}\",\"ref\":\"main\"}" || true

          # 2. Create Release
          curl --fail-with-body --silent --show-error \
            "$BASE_URL/releases" \
            -X POST "${HEADERS[@]}" \
            -d "{\"name\":\"v${VERSION_NAME} (${VERSION_CODE})\",\"tag_name\":\"${RELEASE_TAG}\",\"description\":\"Tag: ${TAG} | Build: ${VERSION_CODE}\"}"

          # 3. Upload MSIX
          MSIX_FILE=$(find msix-out -name "*.msix" | head -1)
          FILE_NAME="kasir-pintar-pos-${TAG}.msix"
          curl --fail-with-body --silent --show-error \
            --request PUT \
            -H "PRIVATE-TOKEN: ${{ secrets.RELEASE_GITLAB_TOKEN }}" \
            --upload-file "$MSIX_FILE" \
            "$BASE_URL/packages/generic/windows-msix/${RELEASE_TAG}/${FILE_NAME}"

          # 4. Link package to Release
          DIRECT_URL="https://${{ secrets.GITLAB_BASE_URL }}/api/v4/projects/${PROJECT_ID}/packages/generic/windows-msix/${RELEASE_TAG}/${FILE_NAME}"
          curl --fail-with-body --silent --show-error \
            "$BASE_URL/releases/${RELEASE_TAG}/assets/links" \
            -X POST "${HEADERS[@]}" \
            -d "{\"name\":\"${FILE_NAME}\",\"url\":\"${DIRECT_URL}\",\"link_type\":\"package\"}"

          echo "✅ https://${{ secrets.GITLAB_BASE_URL }}/alan/desktop-release/-/releases/${RELEASE_TAG}"

      - name: Notify Slack — deploy-windows-release-gitlab failed
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"<@U0CJ1CFSJ0Z> ❌ *KasirPintar POS* — Deploy Windows Release (GitLab) Failed\",
              \"attachments\": [{
                \"color\": \"danger\",
                \"fields\": [
                  {\"title\": \"Tag\", \"value\": \"${{ needs.setup.outputs.tag }}\", \"short\": true},
                  {\"title\": \"Job\", \"value\": \"deploy-windows-release-gitlab\", \"short\": true},
                  {\"title\": \"Logs & Stacktrace\", \"value\": \"<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>\", \"short\": false}
                ]
              }]
            }"

      - name: Notify Slack — deploy succeeded
        if: success()
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"<@U0CJ1CFSJ0Z> ✅ *KasirPintar POS* — Deploy Windows Release (GitLab) Succeeded\",
              \"attachments\": [{
                \"color\": \"good\",
                \"fields\": [
                  {\"title\": \"Tag\", \"value\": \"${{ needs.setup.outputs.tag }}\", \"short\": true},
                  {\"title\": \"Tests Passed\", \"value\": \"${{ needs.test.outputs.test_count }}\", \"short\": true},
                  {\"title\": \"Code Coverage\", \"value\": \"${{ needs.test.outputs.coverage }}%\", \"short\": true},
                  {\"title\": \"Deployment\", \"value\": \"<https://${{ secrets.GITLAB_BASE_URL }}/alan/desktop-release/-/releases/${{ env.RELEASE_TAG }}|View Release>\", \"short\": false},
                  {\"title\": \"Run\", \"value\": \"<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>\", \"short\": false}
                ]
              }]
            }"
